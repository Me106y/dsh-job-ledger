name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    name: gate · pack · publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # A release must not skip the gate. Same three commands as CI on purpose.
      - name: Gate
        run: pnpm check

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const { version } = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (tag !== version) {
              console.error('tag ' + tag + ' does not match package.json ' + version);
              process.exit(1);
            }
          "

      - name: Pack
        run: npm pack

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./dsh-job-ledger-*.tgz --generate-notes

      # Publishing is opt-in: without the NPM_TOKEN secret the release still produces a tarball
      # and a GitHub Release, it just does not push to the registry.
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish ./dsh-job-ledger-*.tgz --provenance --access public
