name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the published tarball contains what we claim
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const required = ['lib/index.js', 'cordis.patch.yml', 'README.md', 'LICENSE'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('missing from tarball:', missing); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('src/') || f.startsWith('test/') || f.startsWith('docs/'));
            if (leaked.length) { console.error('should not ship:', leaked); process.exit(1); }
            console.log('tarball ok:', files.length, 'files');
          "
